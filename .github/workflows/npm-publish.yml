# Publish to npm via Trusted Publisher (OIDC). No long-lived npm token.
# Triggers only when a GitHub Release is created.
# Docs: https://docs.npmjs.com/trusted-publishers/

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Trusted Publisher: do not set NODE_AUTH_TOKEN
      - run: npm publish --provenance --access public
